# Project configuration
# Each team member has their own section

paths:
  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed
  models_dir: models

# === Person 1: preprocessing (src/data.py) ===
data:
  variant: v1
  variants:
    v1:
      pdf_file: ch2_3.pdf          
    v2:
      pdf_file: ch2_3_key_terms.pdf

  # running headers and footers - measured in notebooks/01_data_exploration.ipynb
  top_margin: 36
  bottom_margin: 36

  noise_labels:
    - LINK TO LEARNING
    - MILESTONE
    - LEARNING OBJECTIVES
    - CHAPTER OUTLINE
    - GET CONNECTED

# === Person 2: chunking, embeddings, FAISS ===

chunking:
  chunk_size: 250
  chunk_overlap: 40

embeddings:
  model_name: sentence-transformers/all-MiniLM-L6-v2
  batch_size: 32
  normalize_embeddings: true

vector_search:
  index_type: IndexFlatIP
  top_k: 5

